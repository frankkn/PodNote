name: Deploy to HF Space

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend/ to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q "huggingface_hub>=0.23"
          python - <<'PYEOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          ref = os.environ.get("GITHUB_REF_NAME", "unknown")
          sha = os.environ.get("GITHUB_SHA", "unknown")[:7]

          api.upload_folder(
              folder_path="backend",
              repo_id="frankkn/podnote-api",
              repo_type="space",
              commit_message=f"Deploy {ref} ({sha})",
              delete_patterns=["*"],      # 完整替換：先刪除 HF 上的舊檔
              ignore_patterns=[           # 不上傳這些本機暫存目錄
                  "**/.venv/**",
                  "**/__pycache__/**",
                  "**/_data/**",
                  "**/*.pyc",
              ],
          )
          print(f"✅ Deployed {ref} ({sha}) to HF Space")
          PYEOF

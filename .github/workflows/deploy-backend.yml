name: Deploy Backend to HF Spaces

on:
  push:
    branches: [main]
    paths:
      - "backend/**"   # 只有 backend/ 有變動才觸發，改前端不會重跑

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含完整 git 歷史，subtree split 需要）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push backend/ to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git subtree split --prefix=backend -b hf-deploy
          git push \
            "https://Frankkn:${HF_TOKEN}@huggingface.co/spaces/Frankkn/podnote-api" \
            hf-deploy:main --force
          git branch -D hf-deploy
